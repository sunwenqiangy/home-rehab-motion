name: production-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build -w @home-rehab-motion/main-service
      - run: npm run build -w @home-rehab-motion/admin-web

  analysis-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/analysis-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r services/analysis-service/requirements.txt
      - run: python -m compileall -q services/analysis-service/app

  production-safety-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets and development fallbacks
        run: |
          ! grep -RInE 'AUTH_TOKEN_SECRET=(home-rehab-motion-dev-secret|replace-with-your-secret)|ANALYSIS_INTERNAL_TOKEN=(home-rehab-motion-internal-token|replace-with-your-secret)|MOCK_AUTH_FALLBACK=true|AUTH_ALLOW_LEGACY_MOCK_TOKEN=true|ALLOW_SAMPLE_VIDEO_FALLBACK=true|ALLOW_MOCK_KEYPOINTS_FALLBACK=true' --exclude-dir=.git --exclude-dir=node_modules --exclude=.env --exclude=.env.example --exclude='*.md' --exclude=ci.yml .
      - name: Validate production compose interpolation
        env:
          MYSQL_DATABASE: home_rehab_motion
          MYSQL_USER: home-rehab-motion_app
          MYSQL_PASSWORD: test-password-only
          MYSQL_ROOT_PASSWORD: test-root-password-only
          REDIS_PASSWORD: test-redis-password-only
          AUTH_TOKEN_SECRET: 12345678901234567890123456789012
          ANALYSIS_INTERNAL_TOKEN: 12345678901234567890123456789012
          ANALYSIS_CALLBACK_URL: https://api.example.invalid/api/videos/internal/analysis-callback
          PUBLIC_API_BASE_URL: https://api.example.invalid
          OSS_ENDPOINT: https://oss.example.invalid
          OSS_BUCKET: home-rehab-motion-private
          OSS_ACCESS_KEY_ID: test-access-key
          OSS_ACCESS_KEY_SECRET: test-secret-key
        run: docker compose -f infra/docker-compose.production.yml config --quiet

  container-build:
    needs: [application-quality, analysis-quality, production-safety-gates]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - services/main-service/Dockerfile
          - services/analysis-service/Dockerfile
          - apps/admin-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: home-rehab-motion/ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
