name: publish-production-images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像版本标签（留空时使用 git SHA）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}

jobs:
  validate-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required registry settings
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "$ACR_REGISTRY"
          test -n "$ACR_NAMESPACE"
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"

  publish:
    needs: validate-settings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main-service
            dockerfile: services/main-service/Dockerfile
            image: home-rehab-motion-main
          - name: analysis-service
            dockerfile: services/analysis-service/Dockerfile
            image: home-rehab-motion-analysis
          - name: admin-web
            dockerfile: apps/admin-web/Dockerfile
            image: home-rehab-motion-admin
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mirror-redis:
    needs: validate-settings
    runs-on: ubuntu-latest
    steps:
      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Mirror Redis to Alibaba Cloud Container Registry
        run: |
          docker pull redis:7.4-alpine
          docker tag redis:7.4-alpine "$ACR_REGISTRY/$ACR_NAMESPACE/home-rehab-motion-redis:7.4-alpine"
          docker push "$ACR_REGISTRY/$ACR_NAMESPACE/home-rehab-motion-redis:7.4-alpine"
