name: home-rehab-motion

services:
  mysql:
    image: mysql:8.0
    container_name: home-rehab-motion-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: home_rehab_motion
    ports:
      - '3306:3306'
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: home-rehab-motion-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: home-rehab-motion-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  minio-guidance-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: 'no'
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/home-rehab-motion-assets;
      mc anonymous set download local/home-rehab-motion-assets/guidance"

volumes:
  mysql-data:
  redis-data:
  minio-data:
