name: home-rehab-motion

# 单台 ECS（2C4G）生产编排：
# - 宝塔负责 Nginx、证书和公网 80/443；
# - 宿主机 MySQL 由宝塔管理；
# - Redis 与应用由 Docker 管理；
# - 所有应用端口仅绑定 127.0.0.1，不直接暴露到公网。
services:
  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    # 同时接入分析侧的出站网络；Redis 不暴露宿主机端口，仍只允许 Docker 网络访问。
    networks: [internal, host-access]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  main-service:
    image: ${MAIN_SERVICE_IMAGE:?MAIN_SERVICE_IMAGE is required}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?ANALYSIS_INTERNAL_TOKEN is required}
      ANALYSIS_SERVICE_URL: http://analysis-service:8000
      ANALYSIS_CALLBACK_URL: ${ANALYSIS_CALLBACK_URL:?ANALYSIS_CALLBACK_URL must be public HTTPS}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL must be public HTTPS}
      STORAGE_UPLOAD_MODE: s3_post
      STORAGE_SKIP_DIRECT_OBJECT_CHECK: 'false'
      OSS_ENDPOINT: ${OSS_ENDPOINT:?OSS_ENDPOINT must use HTTPS}
      OSS_BUCKET: ${OSS_BUCKET:?OSS_BUCKET is required}
      OSS_GUIDANCE_BUCKET: ${OSS_GUIDANCE_BUCKET:-}
      OSS_GUIDANCE_PUBLIC_BASE_URL: ${OSS_GUIDANCE_PUBLIC_BASE_URL:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}
      OSS_FORCE_PATH_STYLE: 'false'
      OSS_PUBLIC_BASE_URL: ''
      OSS_PRESIGNED_EXPIRES_SECONDS: ${OSS_PRESIGNED_EXPIRES_SECONDS:-900}
      MOCK_AUTH_FALLBACK: 'false'
      AUTH_ALLOW_LEGACY_MOCK_TOKEN: 'false'
      ALLOW_SAMPLE_VIDEO_FALLBACK: 'false'
      ALLOW_MOCK_KEYPOINTS_FALLBACK: 'false'
      WX_APP_ID: ${WX_APP_ID:?WX_APP_ID is required}
      WX_APP_SECRET: ${WX_APP_SECRET:?WX_APP_SECRET is required}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      redis:
        condition: service_healthy
    # main-service 需要解析 analysis-service；两者必须共享 host-access 网络。
    # 同时保留 edge 以接受宝塔 Nginx 的本地反代，以及 internal 访问 Redis。
    networks: [edge, internal, host-access]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/api/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  # 初始化共享卷的属主。分析镜像以非 root 用户运行，命名卷默认由 root 创建，
  # 因此必须先完成该步骤，Worker 才能安全写入关键点 JSON。
  analysis-storage-init:
    image: ${ANALYSIS_SERVICE_IMAGE:?ANALYSIS_SERVICE_IMAGE is required}
    user: '0:0'
    command: ['sh', '-c', 'mkdir -p /var/lib/home-rehab-motion && chown -R home_rehab_motion:home_rehab_motion /var/lib/home-rehab-motion']
    volumes:
      - analysis-keypoints-data:/var/lib/home-rehab-motion
    restart: 'no'

  analysis-service:
    image: ${ANALYSIS_SERVICE_IMAGE:?ANALYSIS_SERVICE_IMAGE is required}
    # 使用 host-gateway 固定解析宿主机地址，避免部分 ECS/Docker 环境中
    # host.docker.internal 被 DNS 解析到不可路由地址而导致分析 API 访问 MySQL 失败。
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      ANALYSIS_PORT: 8000
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      ANALYSIS_CALLBACK_URL: ${ANALYSIS_CALLBACK_URL:?ANALYSIS_CALLBACK_URL must be public HTTPS}
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?ANALYSIS_INTERNAL_TOKEN is required}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?OSS_ENDPOINT must use HTTPS}
      OSS_BUCKET: ${OSS_BUCKET:?OSS_BUCKET is required}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}
      OSS_FORCE_PATH_STYLE: 'false'
      OSS_PUBLIC_BASE_URL: ''
      # 与 Worker 共享持久卷：API 只读提供关键点骨架预览。
      LOCAL_STORAGE_ROOT: /var/lib/home-rehab-motion
      MAX_ANALYSIS_DURATION_SECONDS: ${MAX_ANALYSIS_DURATION_SECONDS:-300}
      MAX_ANALYSIS_FRAMES: ${MAX_ANALYSIS_FRAMES:-600}
      MAX_POSE_FRAME_WIDTH: ${MAX_POSE_FRAME_WIDTH:-720}
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
      ALLOW_SAMPLE_VIDEO_FALLBACK: 'false'
      ALLOW_MOCK_KEYPOINTS_FALLBACK: 'false'
    volumes:
      - analysis-keypoints-data:/var/lib/home-rehab-motion:ro
    depends_on:
      redis:
        condition: service_healthy
      analysis-storage-init:
        condition: service_completed_successfully
    # 仅使用具备宿主机出站路由的网络，以访问宝塔 MySQL。
    # Redis 同时加入该网络，因此服务发现仍使用 redis 主机名。
    networks: [host-access]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3

  analysis-worker:
    image: ${ANALYSIS_SERVICE_IMAGE:?ANALYSIS_SERVICE_IMAGE is required}
    command: ['celery', '-A', 'app.tasks.celery_app:celery_app', 'worker', '--loglevel=INFO', '--concurrency=1', '--queues=analysis', '--hostname=analysis-worker@%h']
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      ANALYSIS_CALLBACK_URL: ${ANALYSIS_CALLBACK_URL:?ANALYSIS_CALLBACK_URL must be public HTTPS}
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?ANALYSIS_INTERNAL_TOKEN is required}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?OSS_ENDPOINT must use HTTPS}
      OSS_BUCKET: ${OSS_BUCKET:?OSS_BUCKET is required}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}
      OSS_FORCE_PATH_STYLE: 'false'
      OSS_PUBLIC_BASE_URL: ''
      # Worker 负责写入关键点数据；同一命名卷由 analysis-service 只读挂载。
      LOCAL_STORAGE_ROOT: /var/lib/home-rehab-motion
      # 2C2G 单机保护：单任务最多推理 600 帧，避免长视频耗尽宿主机资源。
      MAX_ANALYSIS_DURATION_SECONDS: ${MAX_ANALYSIS_DURATION_SECONDS:-300}
      MAX_ANALYSIS_FRAMES: ${MAX_ANALYSIS_FRAMES:-600}
      MAX_POSE_FRAME_WIDTH: ${MAX_POSE_FRAME_WIDTH:-720}
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
      ALLOW_SAMPLE_VIDEO_FALLBACK: 'false'
      ALLOW_MOCK_KEYPOINTS_FALLBACK: 'false'
    volumes:
      - analysis-keypoints-data:/var/lib/home-rehab-motion
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy
      analysis-storage-init:
        condition: service_completed_successfully
    networks: [host-access]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    # 2C2G 宿主机还承载 MySQL 与业务服务；限制 Worker 防止单任务拖垮整机。
    mem_limit: 1024m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # 仅运行一个 Beat 实例，负责每分钟调度失败分析回调的重试任务。
  analysis-beat:
    image: ${ANALYSIS_SERVICE_IMAGE:?ANALYSIS_SERVICE_IMAGE is required}
    command: ['celery', '-A', 'app.tasks.celery_app:celery_app', 'beat', '--loglevel=INFO']
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      ANALYSIS_CALLBACK_URL: ${ANALYSIS_CALLBACK_URL:?ANALYSIS_CALLBACK_URL must be public HTTPS}
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?ANALYSIS_INTERNAL_TOKEN is required}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?OSS_ENDPOINT must use HTTPS}
      OSS_BUCKET: ${OSS_BUCKET:?OSS_BUCKET is required}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}
      OSS_FORCE_PATH_STYLE: 'false'
      OSS_PUBLIC_BASE_URL: ''
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
      ALLOW_SAMPLE_VIDEO_FALLBACK: 'false'
      ALLOW_MOCK_KEYPOINTS_FALLBACK: 'false'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy
    networks: [host-access]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.15
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  admin-web:
    image: ${ADMIN_WEB_IMAGE:?ADMIN_WEB_IMAGE is required}
    ports:
      - '127.0.0.1:8080:8080'
    networks: [edge]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    mem_limit: 128m
    cpus: 0.25
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  edge:
  # 不映射任何宿主机端口，仅为需要访问宿主机 MySQL 的分析进程提供出站路由。
  # 固定子网，便于宿主机防火墙仅对白名单 Docker 网段开放 MySQL。
  host-access:
    ipam:
      config:
        - subnet: 172.21.0.0/16
  internal:
    internal: true

volumes:
  redis-data:
  # Worker 写入、分析 API 只读访问，持久保存关键点骨架数据。
  analysis-keypoints-data:
