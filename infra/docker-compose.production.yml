name: home-rehab-motion

# 单台 ECS（2C4G）生产编排：
# - 宝塔负责 Nginx、证书和公网 80/443；
# - 宿主机 MySQL 由宝塔管理；
# - Redis 与应用由 Docker 管理；
# - 所有应用端口仅绑定 127.0.0.1，不直接暴露到公网。
services:
  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    networks: [internal]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  main-service:
    image: ${MAIN_SERVICE_IMAGE:?MAIN_SERVICE_IMAGE is required}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?ANALYSIS_INTERNAL_TOKEN is required}
      ANALYSIS_SERVICE_URL: http://analysis-service:8000
      ANALYSIS_CALLBACK_URL: ${ANALYSIS_CALLBACK_URL:?ANALYSIS_CALLBACK_URL must be public HTTPS}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL must be public HTTPS}
      STORAGE_UPLOAD_MODE: s3_post
      STORAGE_SKIP_DIRECT_OBJECT_CHECK: 'false'
      OSS_ENDPOINT: ${OSS_ENDPOINT:?OSS_ENDPOINT must use HTTPS}
      OSS_BUCKET: ${OSS_BUCKET:?OSS_BUCKET is required}
      OSS_GUIDANCE_BUCKET: ${OSS_GUIDANCE_BUCKET:-}
      OSS_GUIDANCE_PUBLIC_BASE_URL: ${OSS_GUIDANCE_PUBLIC_BASE_URL:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}
      OSS_FORCE_PATH_STYLE: 'false'
      OSS_PUBLIC_BASE_URL: ''
      OSS_PRESIGNED_EXPIRES_SECONDS: ${OSS_PRESIGNED_EXPIRES_SECONDS:-900}
      MOCK_AUTH_FALLBACK: 'false'
      AUTH_ALLOW_LEGACY_MOCK_TOKEN: 'false'
      ALLOW_SAMPLE_VIDEO_FALLBACK: 'false'
      ALLOW_MOCK_KEYPOINTS_FALLBACK: 'false'
      WX_APP_ID: ${WX_APP_ID:?WX_APP_ID is required}
      WX_APP_SECRET: ${WX_APP_SECRET:?WX_APP_SECRET is required}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      redis:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/api/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  analysis-service:
    image: ${ANALYSIS_SERVICE_IMAGE:?ANALYSIS_SERVICE_IMAGE is required}
    environment:
      NODE_ENV: production
      ANALYSIS_PORT: 8000
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      ANALYSIS_CALLBACK_URL: ${ANALYSIS_CALLBACK_URL:?ANALYSIS_CALLBACK_URL must be public HTTPS}
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?ANALYSIS_INTERNAL_TOKEN is required}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?OSS_ENDPOINT must use HTTPS}
      OSS_BUCKET: ${OSS_BUCKET:?OSS_BUCKET is required}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}
      OSS_FORCE_PATH_STYLE: 'false'
      OSS_PUBLIC_BASE_URL: ''
      ALLOW_SAMPLE_VIDEO_FALLBACK: 'false'
      ALLOW_MOCK_KEYPOINTS_FALLBACK: 'false'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3

  analysis-worker:
    image: ${ANALYSIS_SERVICE_IMAGE:?ANALYSIS_SERVICE_IMAGE is required}
    command: ['celery', '-A', 'app.tasks.celery_app:celery_app', 'worker', '--loglevel=INFO', '--concurrency=1', '--queues=analysis', '--hostname=analysis-worker@%h']
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      ANALYSIS_CALLBACK_URL: ${ANALYSIS_CALLBACK_URL:?ANALYSIS_CALLBACK_URL must be public HTTPS}
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?ANALYSIS_INTERNAL_TOKEN is required}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?OSS_ENDPOINT must use HTTPS}
      OSS_BUCKET: ${OSS_BUCKET:?OSS_BUCKET is required}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}
      OSS_FORCE_PATH_STYLE: 'false'
      OSS_PUBLIC_BASE_URL: ''
      ALLOW_SAMPLE_VIDEO_FALLBACK: 'false'
      ALLOW_MOCK_KEYPOINTS_FALLBACK: 'false'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1536m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # 仅运行一个 Beat 实例，负责每分钟调度失败分析回调的重试任务。
  analysis-beat:
    image: ${ANALYSIS_SERVICE_IMAGE:?ANALYSIS_SERVICE_IMAGE is required}
    command: ['celery', '-A', 'app.tasks.celery_app:celery_app', 'beat', '--loglevel=INFO']
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      ANALYSIS_CALLBACK_URL: ${ANALYSIS_CALLBACK_URL:?ANALYSIS_CALLBACK_URL must be public HTTPS}
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?ANALYSIS_INTERNAL_TOKEN is required}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?OSS_ENDPOINT must use HTTPS}
      OSS_BUCKET: ${OSS_BUCKET:?OSS_BUCKET is required}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}
      OSS_FORCE_PATH_STYLE: 'false'
      OSS_PUBLIC_BASE_URL: ''
      ALLOW_SAMPLE_VIDEO_FALLBACK: 'false'
      ALLOW_MOCK_KEYPOINTS_FALLBACK: 'false'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.15
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  admin-web:
    image: ${ADMIN_WEB_IMAGE:?ADMIN_WEB_IMAGE is required}
    ports:
      - '127.0.0.1:8080:8080'
    networks: [edge]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    mem_limit: 128m
    cpus: 0.25
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  edge:
  internal:
    internal: true

volumes:
  redis-data:
