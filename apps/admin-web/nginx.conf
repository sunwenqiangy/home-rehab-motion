server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data: https:; frame-ancestors 'none'; base-uri 'self'" always;

    # 拍摄要求模板图随 main-service 镜像分发，生产环境下需从管理端域名转发到主服务。
    # 保留原始 URI，确保 /guidance-defaults/<file> 能被 Nest 的静态资源路由命中。
    location ^~ /guidance-defaults/ {
        proxy_pass http://main-service:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
